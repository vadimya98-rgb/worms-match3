name: Build Android APK (Capacitor)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor CLI and Core
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets @capacitor/haptics@7

      - name: Prepare Game Files
        run: |
          mkdir -p www
          cp -r index.html style.css src assets www/
          mkdir -p www/libs
          curl -L -o www/libs/phaser.min.js https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js
          sed -i 's|https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js|libs/phaser.min.js|' www/index.html

      - name: Create Capacitor Config
        run: |
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.adimya98.wormiks",
            "appName": "Wormiks",
            "webDir": "www"
          }
          EOF

      - name: Add Android Platform
        run: npx cap add android

      - name: Generate App Icons
        run: |
          echo "Проверка папки resources:"
          ls -la resources/ || echo "Папка resources не найдена!"
          npx @capacitor/assets generate --android --iconBackgroundColor '#1a1a2e' --iconBackgroundColorDark '#1a1a2e'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WormsMatch3-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
