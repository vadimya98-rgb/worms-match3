name: Build Android APK (Capacitor)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor CLI and Core
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets @capacitor/haptics@7

      - name: Prepare Game Files
        run: |
          mkdir -p www
          cp -r index.html style.css src assets www/
          mkdir -p www/libs
          curl -L -o www/libs/phaser.min.js https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js
          sed -i 's|https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js|libs/phaser.min.js|' www/index.html

      - name: Add Android Platform
        run: npx cap add android

      - name: Generate App Icons
        run: |
          echo "=== resources/ ==="
          ls -la resources/ || echo "❌ resources/ не найдена"
          npx @capacitor/assets generate --android \
            --assetPath resources \
            --iconBackgroundColor '#1a1a2e' \
            --iconBackgroundColorDark '#1a1a2e'

      - name: Sync Capacitor
        run: npx cap sync android

      # ═══════════ ПОСТОЯННЫЙ KEYSTORE ═══════════
      - name: Restore Keystore from Cache
        uses: actions/cache@v4
        id: keystore-cache
        with:
          path: .keystore
          key: wormix-keystore-v1

      - name: Generate Keystore if Missing
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .keystore
          keytool -genkeypair -v \
            -keystore .keystore/release.keystore \
            -alias wormix-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 'WormixMatch2026!' \
            -keypass 'WormixMatch2026!' \
            -dname "CN=Wormix Match, OU=Game, O=Indie, L=Moscow, S=Moscow, C=RU"

      - name: Setup Signing Config
        run: |
          cp .keystore/release.keystore android/app/release.keystore
          python3 << 'PYEOF'
          import re
          p = 'android/app/build.gradle'
          s = open(p).read()

          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'WormixMatch2026!'
                      keyAlias 'wormix-key'
                      keyPassword 'WormixMatch2026!'
                  }
              }
          '''

          s = s.replace('android {', 'android {\n' + signing_block, 1)

          s = re.sub(
              r'(buildTypes\s*\{[^}]*?release\s*\{)',
              r'\1\n            signingConfig signingConfigs.release',
              s,
              count=1
          )

          open(p, 'w').write(s)
          print('✅ build.gradle пропатчен')
          PYEOF

      - name: Build Signed Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify Signature
        run: |
          echo "=== Проверка подписи APK ==="
          keytool -printcert -jarfile android/app/build/outputs/apk/release/app-release.apk 2>&1 | head -20

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WormsMatch3-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Keystore (BACKUP)
        uses: actions/upload-artifact@v4
        with:
          name: wormix-keystore-backup
          path: .keystore/release.keystore
          retention-days: 90
