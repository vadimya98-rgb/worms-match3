name: Build Android APK (Capacitor)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor CLI and Core
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets @capacitor/haptics@7

      - name: Prepare Game Files
        run: |
          mkdir -p www
          cp -r index.html style.css src assets www/
          mkdir -p www/libs
          curl -L -o www/libs/phaser.min.js https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js
          sed -i 's|https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js|libs/phaser.min.js|' www/index.html

      # ⚠️ ШАГ "Create Capacitor Config" УДАЛЁН — теперь используется файл из репозитория

      - name: Add Android Platform
        run: npx cap add android

      - name: Generate App Icons
        run: |
          echo "=== resources/ ==="
          ls -la resources/ || echo "❌ resources/ не найдена"
          echo "=== assets/ (игровые) ==="
          ls -la assets/ | head -20
          npx @capacitor/assets generate --android \
            --assetPath resources \
            --iconBackgroundColor '#1a1a2e' \
            --iconBackgroundColorDark '#1a1a2e'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify Config and Icons
        run: |
          echo "=== capacitor.config.json ==="
          cat capacitor.config.json
          echo ""
          echo "=== strings.xml (имя приложения) ==="
          cat android/app/src/main/res/values/strings.xml
          echo ""
          echo "=== mipmap-xxxhdpi (иконка) ==="
          ls -la android/app/src/main/res/mipmap-xxxhdpi/ || echo "❌ mipmap не найдены"

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WormsMatch3-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
