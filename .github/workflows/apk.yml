name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Capacitor
        run: npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor/assets
      - name: Create Config
        run: echo '{"appId": "com.adimya98.wormiks", "appName": "Wormiks", "webDir": "www"}' > capacitor.config.json
      - name: Create WWW Dir
        run: mkdir -p www
      - name: Copy Files
        run: cp -r index.html style.css src assets www/
      - name: Create Libs Dir
        run: mkdir -p www/libs
      - name: Download Phaser
        run: curl -L -o www/libs/phaser.min.js https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js
      - name: Update HTML path
        run: sed -i 's|https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js|libs/phaser.min.js|' www/index.html
      - name: Add Android
        run: npx cap add android
      - name: Generate Icons
        run: npx @capacitor/assets generate --android
      - name: Sync
        run: npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wormiks-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
